<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08131c">
  <meta name="robots" content="noindex">
  <title>Page not found / Сторінку не знайдено — AutoMethods</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon.png">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08131c; color: #e7eef4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 44rem; }
    .brand { color: #78c9c8; font-weight: 650; letter-spacing: .03em; }
    .code { margin: 24px 0 8px; color: #78c9c8; font-size: clamp(4rem, 15vw, 7rem); line-height: 1; }
    h1 { margin: 16px 0 24px; font-size: clamp(1.4rem, 5vw, 2rem); line-height: 1.4; }
    h1 span { display: block; }
    p { color: #aebfcb; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border: 1px solid #78c9c8; border-radius: 8px; color: #e7eef4; text-decoration: none; }
    a:hover { background: #123039; }
    a:focus-visible { outline: 3px solid #78c9c8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">AutoMethods</div>
    <p class="code" aria-hidden="true">404</p>
    <h1><span>Page not found</span><span lang="uk">Сторінку не знайдено</span></h1>
    <p>This address may be incorrect, or the page may have moved.</p>
    <p lang="uk">Можливо, адреса містить помилку або сторінку переміщено.</p>
    <a href="/">Home <span lang="uk">/ Головна</span></a>
  </main>
</body>
</html>
